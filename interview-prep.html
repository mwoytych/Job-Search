:root{
    --primary:#2563eb;
    --secondary:#1d4ed8;
    --success:#059669;
    --warning:#d97706;

    --light:#f8fafc;
    --border:#e5e7eb;

    --footer-text:#6b7280;
    --shadow:rgba(0,0,0,.08);
    --font-scale:1;
}

[data-theme="dark"]{
    --primary:#58a6ff;

}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--bg-body);
    color:var(--text-main);
    transition:background .3s, color .3s;
}

.skip-link{
    position:absolute;top:-60px;left:0;background:var(--primary);color:#fff;
    padding:10px 16px;z-index:1000;text-decoration:none;border-radius:0 0 8px 0;transition:top .2s;
}
.skip-link:focus{top:0;}

.sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

.a11y-bar{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;
    background:var(--bg-card);border-bottom:1px solid var(--border);padding:10px 16px;
    position:sticky;top:0;z-index:900;
}
